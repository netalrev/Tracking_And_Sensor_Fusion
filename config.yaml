# ==========================================
# Simulation Configuration
# ==========================================
simulation:
  duration_sec: 90.0
  truth_rate_hz: 100.0  # High rate for smooth Ground Truth integration
  random_seed: 42       # Critical for reproducibility across experiments

# ==========================================
# Targets Configuration (Dynamic Lifespans & Edge Cases)
# ==========================================
targets:
  - id: 1 
    start_time: 0.0      # Appears immediately
    end_time: 90.0       # Survives until the end
    initial_position: [0.0, 5000.0, 3000.0]
    initial_velocity: [100.0, 0.0, 0.0] 
    maneuvers:
      - start_time: 35.0  
        end_time: 45.0
        turn_rate_deg: 5.0 # Turns right after crossing

  - id: 2 
    start_time: 10.0     # Appears after 10s (Track Initiation test)
    end_time: 90.0
    initial_position: [3000.0, 2000.0, 3000.0]
    initial_velocity: [0.0, 100.0, 0.0] 

  - id: 3 
    start_time: 0.0
    end_time: 50.0       # Disappears mid-simulation (Track Deletion test)
    initial_position: [0.0, 8000.0, 3000.0]
    initial_velocity: [100.0, -100.0, 0.0] 

  - id: 4
    start_time: 40.0     # Appears late
    end_time: 90.0
    initial_position: [0.0, 500.0, 3000.0]
    initial_velocity: [100.0, 2.0, 0.0] 

  - id: 5
    start_time: 40.0     # Appears late, parallel to target 4 (Proximity test)
    end_time: 90.0
    initial_position: [0.0, 740.0, 3000.0]
    initial_velocity: [100.0, -2.0, 0.0] 

# ==========================================
# Sensors Configuration (Hard Mode - Aim To Realistic Environment)
# ==========================================
# sensors:
#   radar:
#     rate_hz: 1.0
#     drop_probability: 0.15   # 15% chance to miss a target (Forces coasting)
#     clutter_lambda: 0.0      # Average 4 false alarm per scan (High clutter)
#     noise_std:
#       range_m: 20.0          # Slightly worse range resolution
#       azimuth_deg: 1.2       # Typical search radar angular noise
#       elevation_deg: 1.2
#       radial_vel_ms: 2.5
#     bias:
#       range_m: 20.0
#       azimuth_deg: 0.2
#       elevation_deg: -0.1

#   eo:
#     rate_hz: 10.0
#     drop_probability: 0.05   # 5% target drop (Clouds, obscuration)
#     clutter_lambda: 0.0     # 1 false alarm per frame on average
#     noise_std:
#       azimuth_deg: 0.15      # Realistic camera jitter/pixelization
#       elevation_deg: 0.15
#     bias:
#       azimuth_deg: -0.05
#       elevation_deg: 0.0

# ==========================================
# Sensors Configuration (Simple Mode - Easy Tests Environment)
# ==========================================
sensors:
  radar:
    rate_hz: 1.0
    drop_probability: 0.05 # 5% chance of dropping a radar scan
    clutter_lambda: 1.0   # Average of 1 false alarm per scan (Poisson Distribution)
    # Noise standard deviations (to simulate sensor noise)
    noise_std:
      range_m: 15.0 # Moderate range noise
      azimuth_deg: 0.5 # Moderate azimuth noise
      elevation_deg: 0.5 # Moderate elevation noise
      radial_vel_ms: 2.0 # Moderate radial velocity noise

    # Biases (to simulate misalignment and calibration errors)
    bias:
      range_m: 20.0       # Constant 20m range bias
      azimuth_deg: 0.2    # Physically rotated by 0.2 degrees
      elevation_deg: -0.1 # Slight downward tilt

  eo:
    rate_hz: 10.0
    drop_probability: 0.02 
    clutter_lambda: 0.2   # Average of 0.2 false alarms per frame (Cleaner view)
    noise_std:
      azimuth_deg: 0.05    
      elevation_deg: 0.05
    bias:
      azimuth_deg: -0.05  # Camera bias in the opposite direction
      elevation_deg: 0.0