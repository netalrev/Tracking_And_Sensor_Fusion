# ==========================================
# Simulation Configuration
# ==========================================
simulation:
  duration_sec: 120.0
  truth_rate_hz: 100.0  
  random_seed: 42       

# ==========================================
# Targets Configuration
# ==========================================
targets:
  - id: 1 
    start_time: 0.0      
    end_time: 90.0       
    initial_position: [0.0, 5000.0, 3000.0]
    initial_velocity: [100.0, 0.0, 0.0] 
    maneuvers:
      - start_time: 35.0  
        end_time: 45.0
        turn_rate_deg: 10.0 # degrees per second

  - id: 2 
    start_time: 10.0     
    end_time: 90.0
    initial_position: [3000.0, 2000.0, 3000.0]
    initial_velocity: [0.0, 100.0, 0.0] 

  - id: 3 
    start_time: 0.0
    end_time: 50.0       
    initial_position: [0.0, 8000.0, 3000.0]
    initial_velocity: [100.0, -100.0, 0.0] 

  - id: 4
    start_time: 40.0     
    end_time: 120.0
    initial_position: [0.0, 500.0, 3000.0]
    initial_velocity: [100.0, 2.0, 0.0] 

  - id: 5
    start_time: 40.0     
    end_time: 120.0
    initial_position: [0.0, 740.0, 3000.0]
    initial_velocity: [100.0, -2.0, 0.0]
    maneuvers:
      - start_time: 80.0  
        end_time: 86.0
        turn_rate_deg: 15.0 # degrees per second

# ==========================================
# Sensors Configuration (The Baseline)
# ==========================================
sensors:
  radar:
    rate_hz: 1.0
    drop_probability: 0.20   # 20% chance to drop a scan 
    clutter_lambda: 4.0      # Average 4 false alarms per scan 
    noise_std:
      range_m: 20.0          # Realistic range noise
      azimuth_deg: 0.75      # Realistic angular noise
      elevation_deg: 0.75
      radial_vel_ms: 2.5
    bias:
      range_m: 10.0          # small range bias
      azimuth_deg: 0.15      
      elevation_deg: -0.1

  eo:
    rate_hz: 10.0
    drop_probability: 0.15   # 15% target drop 
    clutter_lambda: 3.0      # 3 false alarms per frame
    noise_std:
      azimuth_deg: 0.15      
      elevation_deg: 0.15
    bias:
      azimuth_deg: 0.05      # Small camera misalignment
      elevation_deg: 0.02